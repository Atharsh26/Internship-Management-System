<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 th:text="${type == 'student'} ? 'Student Registration' : 'Company Registration'">Registration</h1>
    <p class="sub" th:if="${type == 'company'}">Your company will be verified by the placement coordinator before you can post internships.</p>
    <form th:action="@{/register/{t}(t=${type})}" th:object="${form}" method="post">
      <div class="form-group">
        <label th:text="${type == 'student'} ? 'Full name' : 'Contact person name'">Name</label>
        <input type="text" th:field="*{name}">
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{email}">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" th:field="*{password}">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <th:block th:if="${type == 'student'}">
        <div class="form-group">
          <label>Register number</label>
          <input type="text" th:field="*{registerNumber}">
          <div class="error" th:if="${#fields.hasErrors('registerNumber')}" th:errors="*{registerNumber}"></div>
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" th:field="*{department}" placeholder="e.g. CSE">
        </div>
      </th:block>
      <th:block th:if="${type == 'company'}">
        <div class="form-group">
          <label>Company name</label>
          <input type="text" th:field="*{companyName}">
          <div class="error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
        </div>
      </th:block>
      <button type="submit" class="btn">Create account</button>
    </form>
    <p class="small" style="text-align:center;margin-top:1.2rem">Already registered? <a th:href="@{/login}">Login</a></p>
  </div>
</div>
</body>
</html>
