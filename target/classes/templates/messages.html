<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Messages')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <p><a th:href="@{/}">&larr; Back</a></p>
  <h1>Messages &ndash; <span th:text="${app.internship.title}">t</span></h1>
  <p class="muted"><span th:text="${app.student.user.name}">s</span> &harr; <span th:text="${app.internship.company.companyName}">c</span></p>
  <div class="card">
    <div class="chat">
      <div class="card empty" th:if="${items.isEmpty()}">No messages yet. Ask a question or discuss a task.</div>
      <div class="bubble" th:each="m : ${items}" th:classappend="${m.sender.email == me} ? 'me'">
        <div class="small"><strong th:text="${m.sender.name}">n</strong> &middot; <span th:text="${#temporals.format(m.sentAt, 'dd MMM, hh:mm a')}">t</span></div>
        <div th:text="${m.content}" style="white-space:pre-line">c</div>
      </div>
    </div>
    <form th:action="@{/messages/application/{id}(id=${app.id})}" method="post">
      <div class="form-group"><textarea name="content" required maxlength="2000" placeholder="Write a message, feedback or a meeting suggestion..."></textarea></div>
      <button class="btn" type="submit">Send</button>
    </form>
  </div>
</main>
</body>
</html>
