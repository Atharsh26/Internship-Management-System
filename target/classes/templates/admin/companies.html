<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Companies')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>Companies</h1>
  <div class="card empty" th:if="${companies.isEmpty()}">No companies registered yet.</div>
  <div class="table-wrap" th:if="${!companies.isEmpty()}">
    <table>
      <thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>Status</th><th></th></tr></thead>
      <tbody><tr th:each="c : ${companies}">
        <td th:text="${c.companyName}">Company</td>
        <td th:text="${c.user.name}">Contact</td>
        <td th:text="${c.user.email}">email</td>
        <td><span class="badge badge-ok" th:if="${c.verified}">Verified</span>
            <span class="badge badge-warn" th:unless="${c.verified}">Pending</span></td>
        <td>
          <form th:unless="${c.verified}" th:action="@{/admin/companies/{id}/verify(id=${c.id})}" method="post">
            <input type="hidden" name="value" value="true"><button class="btn btn-sm btn-ok" type="submit">Verify</button></form>
          <form th:if="${c.verified}" th:action="@{/admin/companies/{id}/verify(id=${c.id})}" method="post"
                data-confirm="Revoke verification for this company?">
            <input type="hidden" name="value" value="false"><button class="btn btn-sm btn-bad" type="submit">Revoke</button></form>
        </td>
      </tr></tbody>
    </table>
  </div>
</main>
</body>
</html>
