<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Analytics')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>Reports &amp; Analytics</h1>
  <div class="grid">
    <div class="card stat"><div class="num" th:text="${studentCount}">0</div><div class="lbl">Registered students</div></div>
    <div class="card stat"><div class="num" th:text="${internshipCount}">0</div><div class="lbl">Internship opportunities</div></div>
    <div class="card stat"><div class="num" th:text="${placed}">0</div><div class="lbl">Students placed</div></div>
    <div class="card stat"><div class="num" th:text="${successRate} + '%'">0%</div><div class="lbl">Application success rate</div></div>
    <div class="card stat"><div class="num" th:text="${applicationCount}">0</div><div class="lbl">Applications</div></div>
    <div class="card stat"><div class="num" th:text="${verifiedCompanies} + ' / ' + ${companyCount}">0</div><div class="lbl">Verified companies</div></div>
    <div class="card stat"><div class="num" th:text="${certificateCount}">0</div><div class="lbl">Certificates issued</div></div>
  </div>
  <h2>Company participation</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>Company</th><th>Internships posted</th><th>Students placed</th></tr></thead>
    <tbody><tr th:each="e : ${perCompany}"><td th:text="${e.key}">c</td><td th:text="${e.value}">0</td><td th:text="${placedPerCompany[e.key]}">0</td></tr></tbody></table></div>
</main>
</body>
</html>
