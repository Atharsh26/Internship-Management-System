<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Scam Check')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>Internship Scam Detection</h1>
  <div class="card" style="max-width:760px">
    <p class="muted">Paste a suspicious internship email. You get a <strong>risk assessment</strong> - not a guarantee that the email is safe or fake.</p>
    <form th:action="@{/student/scam/check}" method="post">
      <div class="form-group"><label>Sender email address</label><input type="text" name="senderEmail" placeholder="hr.recruiter123@gmail.com"></div>
      <div class="form-group"><label>Subject</label><input type="text" name="subject"></div>
      <div class="form-group"><label>Email content (include any links)</label><textarea name="content" required maxlength="4000" style="min-height:180px"></textarea></div>
      <button class="btn" type="submit">Check risk</button>
    </form>
  </div>
  <h2>My previous checks</h2>
  <div class="card empty" th:if="${history.isEmpty()}">No checks yet.</div>
  <div class="table-wrap" th:if="${!history.isEmpty()}">
    <table><thead><tr><th>Date</th><th>Sender</th><th>Subject</th><th>Risk</th><th>Reported</th><th></th></tr></thead>
      <tbody><tr th:each="h : ${history}">
        <td th:text="${#temporals.format(h.createdAt, 'dd MMM yyyy')}">d</td>
        <td th:text="${h.senderEmail}">s</td><td th:text="${h.subject}">sub</td>
        <td><span th:class="${'risk-' + h.riskLevel}" th:text="${h.riskLevel + ' (' + h.riskScore + ')'}">LOW</span></td>
        <td th:text="${h.reported ? h.adminStatus : '-'}">-</td>
        <td><a th:href="@{/student/scam/{id}(id=${h.id})}">Open</a></td>
      </tr></tbody></table>
  </div>
</main>
</body>
</html>
