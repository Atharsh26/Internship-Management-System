<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Intern Progress')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <p><a th:href="@{/company/internships/{id}/applications(id=${app.internship.id})}">&larr; Back</a></p>
  <h1><span th:text="${app.student.user.name}">Name</span> &ndash; <span th:text="${app.internship.title}">t</span></h1>
  <div class="card">
    <div class="meter"><span th:style="${'width:' + completion + '%'}"></span></div>
    <strong th:text="${completion} + '% of tasks completed'">0%</strong>
    <div class="row" style="margin-top:.7rem">
      <a class="btn btn-sm btn-gray" th:href="@{/messages/application/{id}(id=${app.id})}">Messages</a>
      <form th:if="${certificate == null}" th:action="@{/company/applications/{id}/certificate(id=${app.id})}" method="post"
            data-confirm="Mark the internship complete and issue a certificate?"><button class="btn btn-sm btn-ok" type="submit">Mark complete &amp; issue certificate</button></form>
      <span th:if="${certificate != null}">Certificate: <a th:href="@{/certificates/{id}(id=${certificate.certificateId})}" th:text="${certificate.certificateId}">id</a></span>
    </div>
  </div>
  <h2>Tasks</h2>
  <div class="card">
    <form th:action="@{/company/applications/{id}/tasks(id=${app.id})}" method="post" class="row">
      <input type="text" name="title" placeholder="Task title" required style="width:200px">
      <input type="text" name="description" placeholder="Details" style="width:260px">
      <input type="date" name="dueDate" style="width:auto">
      <button class="btn btn-sm" type="submit">Assign task</button>
    </form>
  </div>
  <div class="table-wrap" th:if="${!tasks.isEmpty()}"><table>
    <thead><tr><th>Task</th><th>Details</th><th>Due</th><th>Status</th></tr></thead>
    <tbody><tr th:each="t : ${tasks}"><td th:text="${t.title}">t</td><td th:text="${t.description}">d</td>
      <td th:text="${t.dueDate != null} ? ${#temporals.format(t.dueDate, 'dd MMM yyyy')} : '-'">due</td>
      <td><span class="badge" th:classappend="${t.done} ? 'badge-ok' : 'badge-warn'" th:text="${t.done} ? 'Done' : 'Open'">s</span></td></tr></tbody></table></div>
  <h2>Weekly reports &amp; feedback</h2>
  <div class="card empty" th:if="${reports.isEmpty()}">No reports submitted yet.</div>
  <div class="card" th:each="r : ${reports}">
    <strong th:text="'Week ' + ${r.weekNumber}">w</strong> <span class="muted small" th:text="${#temporals.format(r.submittedOn, 'dd MMM yyyy')}">d</span>
    <p th:text="${r.content}" style="white-space:pre-line">c</p>
    <form th:action="@{/company/reports/{id}/feedback(id=${r.id})}" method="post" class="row">
      <input type="text" name="feedback" maxlength="1000" th:value="${r.mentorFeedback}" placeholder="Mentor feedback" style="width:420px">
      <button class="btn btn-sm" type="submit">Save feedback</button>
    </form>
  </div>
</main>
</body>
</html>
