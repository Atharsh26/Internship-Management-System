spring.application.name=internship-management-system
# Railway sets PORT; locally it falls back to 8080
server.port=${PORT:8080}

# ---- MySQL (change username/password to match your MySQL) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internship_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:marvel126}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.forward-headers-strategy=framework

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Resume upload folder (created automatically)
app.upload-dir=${UPLOAD_DIR:uploads}

# Default admin account (created on first start)
app.admin.name=Placement Coordinator
app.admin.email=${ADMIN_EMAIL:admin@college.edu}
app.admin.password=${ADMIN_PASSWORD:admin123}
