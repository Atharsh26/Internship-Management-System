<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Resume & Skill Analyzer')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>Resume Analyzer &amp; Skill Gap</h1>
  <div class="card" style="max-width:700px">
    <form th:action="@{/student/analyzer}" method="post">
      <div class="form-group"><label>Target internship</label>
        <select name="internshipId" required>
          <option th:each="i : ${openInternships}" th:value="${i.id}" th:selected="${i.id == selected}"
                  th:text="${i.title + ' - ' + i.company.companyName}"></option></select></div>
      <div class="form-group"><label>Analyze</label>
        <label><input type="radio" name="mode" value="resume" checked> My uploaded resume (PDF/DOCX)</label><br>
        <label><input type="radio" name="mode" value="skills"> The skills in my profile</label></div>
      <button class="btn" type="submit">Analyze</button>
    </form>
  </div>
  <div class="card" th:if="${result != null}">
    <h2><span th:text="${resumeMode} ? 'Resume' : 'Profile skills'">x</span> vs <span th:text="${target.title}">t</span></h2>
    <div class="meter"><span th:style="${'width:' + result.matchPercent + '%'}"></span></div>
    <p><strong th:text="${result.matchPercent} + '% match with the posting requirements'">0%</strong></p>
    <p th:if="${!result.matched.isEmpty()}">Matched skills: <span class="pill ok" th:each="m : ${result.matched}" th:text="${m}"></span></p>
    <p th:if="${!result.missing.isEmpty()}">Missing skills (click for learning resources):
      <a class="pill bad" th:each="m : ${result.resources}" th:href="${m.value}" target="_blank" rel="noopener" th:text="${m.key} + ' &#8599;'"></a></p>
    <h3>Suggestions</h3>
    <ul><li th:each="t : ${result.tips}" th:text="${t}"></li></ul>
    <p class="small muted">This is a keyword-based estimate to guide improvements. It is not a hiring decision.</p>
  </div>
</main>
</body>
</html>
