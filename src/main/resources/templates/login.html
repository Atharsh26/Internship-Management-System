
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <h1>Internship Management System</h1>
    <p class="sub">Sign in to continue</p>

    <div class="alert alert-error" th:if="${param.error}">
      Invalid email or password, or account disabled.
    </div>

    <div class="alert alert-info" th:if="${param.logout}">
      You have been logged out.
    </div>

    <div class="alert alert-success" th:if="${param.registered}">
      Registration successful. Please log in.
    </div>

    <form th:action="@{/login}" method="post">

      <div class="form-group">
        <label for="username">Email</label>
        <input type="email"
               id="username"
               name="username"
               required
               autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="password"
                 id="password"
                 name="password"
                 required
                 style="flex: 1; min-width: 0;">

          <button type="button"
                  class="btn btn-gray"
                  id="togglePassword"
                  onclick="togglePasswordVisibility()">
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="btn">Login</button>

    </form>

    <p class="small" style="text-align:center;margin-top:1.2rem">
      New here?
      <a th:href="@{/register/student}">Register as Student</a>
      &middot;
      <a th:href="@{/register/company}">Register as Company</a>
    </p>

  </div>
</div>

<!-- Show / Hide Password -->
<script>
  function togglePasswordVisibility() {
    const password = document.getElementById("password");
    const button = document.getElementById("togglePassword");

    if (password.type === "password") {
      password.type = "text";
      button.textContent = "Hide";
    } else {
      password.type = "password";
      button.textContent = "Show";
    }
  }
</script>

</body>
</html>
