<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>My Profile</h1>
  <div class="card settings">
    <dl class="info-list">
      <dt>Name</dt><dd th:text="${user.name}">Name</dd>
      <dt>Email</dt><dd th:text="${user.email}">email</dd>
      <dt>Role</dt><dd th:text="${user.role}">ROLE</dd>
      <th:block th:if="${company != null}">
        <dt>Company</dt><dd th:text="${company.companyName}">Company</dd>
        <dt>Verification</dt>
        <dd><span class="badge badge-ok" th:if="${company.verified}">Verified</span>
            <span class="badge badge-warn" th:unless="${company.verified}">Pending</span></dd>
      </th:block>
    </dl>
  </div>
  <div class="card" th:if="${company != null}" style="max-width:700px">
    <h2>Company profile</h2>
    <form th:action="@{/company/profile}" method="post">
      <div class="form-group"><label>Company name</label><input type="text" name="companyName" th:value="${company.companyName}" required></div>
      <div class="form-group"><label>About the company</label><textarea name="description" maxlength="1000" th:text="${company.description}"></textarea></div>
      <div class="form-group"><label>Website</label><input type="url" name="website" th:value="${company.website}" placeholder="https://example.com"></div>
      <button class="btn" type="submit">Save company profile</button>
    </form>
  </div>
  <div th:replace="~{fragments/layout :: settings}"></div>
</main>
</body>
</html>
