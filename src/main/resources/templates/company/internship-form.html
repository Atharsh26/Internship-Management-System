<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Post Internship')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <h1 th:text="${editing} ? 'Edit internship' : 'Post a new internship'">Post a new internship</h1>
  <p class="muted small" th:if="${editing}">Review and update the details below. Saving changes sends the listing back to the admin for approval.</p>
  <div class="card" style="max-width:700px">
    <form th:action="${editing} ? @{/company/internships/{id}/edit(id=${internshipId})} : @{/company/internships}" th:object="${form}" method="post">
      <div class="form-group"><label>Title</label>
        <input type="text" th:field="*{title}">
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div></div>
      <div class="form-group"><label>Description</label>
        <textarea th:field="*{description}"></textarea>
        <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div></div>
      <div class="form-group"><label>Eligibility requirements</label>
        <textarea th:field="*{eligibility}" placeholder="e.g. CSE/IT, 3rd year, CGPA 7.5+, knowledge of Java"></textarea>
        <div class="error" th:if="${#fields.hasErrors('eligibility')}" th:errors="*{eligibility}"></div></div>
      <div class="form-group"><label>Location</label>
        <input type="text" th:field="*{location}" placeholder="e.g. Chennai / Remote"></div>
      <div class="form-group"><label>Domain</label>
        <input type="text" th:field="*{domain}" placeholder="e.g. Web Development, Data Science, Marketing"></div>
      <div class="form-group"><label>Monthly stipend (&#8377;, leave empty if unpaid)</label>
        <input type="number" th:field="*{stipend}" min="0" step="500">
        <div class="error" th:if="${#fields.hasErrors('stipend')}" th:errors="*{stipend}"></div></div>
      <div class="form-group"><label>Application deadline</label>
        <input type="date" th:field="*{deadline}">
        <div class="error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></div></div>
      <div class="row">
        <button type="submit" class="btn" th:text="${editing} ? 'Save changes and resubmit' : 'Submit for approval'">Submit for approval</button>
        <a class="btn btn-gray" th:href="@{/company/dashboard}">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
