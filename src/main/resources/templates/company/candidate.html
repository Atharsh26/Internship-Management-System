<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Candidate')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <p><a th:href="@{/company/internships/{id}/applications(id=${app.internship.id})}">&larr; Back to applications</a></p>
  <div class="card" style="max-width:760px">
    <h1 th:text="${student.user.name}">Name</h1>
    <span class="badge" th:classappend="${'st-' + app.status}" th:text="${app.status.label}">s</span>
    <dl class="info-list">
      <dt>Email</dt><dd th:text="${student.user.email}">e</dd>
      <dt>Phone</dt><dd th:text="${student.phone}">p</dd>
      <dt>Register no.</dt><dd th:text="${student.registerNumber}">r</dd>
      <dt>Department</dt><dd th:text="${student.department}">d</dd>
      <dt>Education</dt><dd th:text="${student.education}" style="white-space:pre-line">e</dd>
      <dt>Skills</dt><dd th:text="${student.skills}">s</dd>
      <dt>Certifications</dt><dd th:text="${student.certifications}" style="white-space:pre-line">c</dd>
      <dt>GitHub</dt><dd><a th:if="${student.githubUrl != null}" th:href="${student.githubUrl}" target="_blank" rel="noopener noreferrer" th:text="${student.githubUrl}">g</a></dd>
      <dt>LinkedIn</dt><dd><a th:if="${student.linkedinUrl != null}" th:href="${student.linkedinUrl}" target="_blank" rel="noopener noreferrer" th:text="${student.linkedinUrl}">l</a></dd>
    </dl>
    <a class="btn" th:href="@{/resumes/application/{id}(id=${app.id})}">Download resume</a>
    <a class="btn btn-gray" th:href="@{/messages/application/{id}(id=${app.id})}">Messages</a>
  </div>
  <h2>Interviews</h2>
  <div class="card empty" th:if="${interviews.isEmpty()}">None scheduled.</div>
  <div class="card" th:each="iv : ${interviews}">
    <strong th:text="${#temporals.format(iv.scheduledAt, 'dd MMM yyyy, hh:mm a')}">w</strong> &middot; <span th:text="${iv.mode}">m</span>
    <span th:if="${iv.locationOrLink != null}"> &middot; <span th:text="${iv.locationOrLink}"></span></span>
    <div class="muted small" th:text="${iv.notes}">n</div>
  </div>
</main>
</body>
</html>
