<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Applications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="spread">
    <h1>All applications</h1>
    <span class="muted small" th:if="${selectedStatus != null}" th:text="'Filtered by: ' + ${selectedStatus}">Filtered</span>
    <div class="row">
      <a class="btn btn-gray" th:href="@{/admin/applications}">Clear filter</a>
      <a class="btn btn-gray" th:href="@{/admin/reports/applications.csv}">Download CSV</a>
    </div>
  </div>
  <div class="card empty" th:if="${applications.isEmpty()}">No applications yet.</div>
  <div class="table-wrap" th:if="${!applications.isEmpty()}">
    <table>
      <thead><tr><th>Student</th><th>Reg. No.</th><th>Internship</th><th>Company</th><th>Applied</th><th>Resume</th><th>Status</th></tr></thead>
      <tbody><tr th:each="a : ${applications}">
        <td th:text="${a.student.user.name}">Name</td>
        <td th:text="${a.student.registerNumber}">123</td>
        <td th:text="${a.internship.title}">Title</td>
        <td th:text="${a.internship.company.companyName}">Company</td>
        <td th:text="${#temporals.format(a.appliedDate, 'dd MMM yyyy')}">date</td>
        <td><a th:href="@{/resumes/application/{id}(id=${a.id})}">Download</a></td>
        <td><span class="badge" th:classappend="${'st-' + a.status}" th:text="${a.status}">PENDING</span></td>
      </tr></tbody>
    </table>
  </div>
</main>
</body>
</html>
