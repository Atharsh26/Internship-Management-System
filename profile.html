<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>My Profile</h1>
  <div class="card" style="max-width:700px">
    <form th:action="@{/student/profile}" method="post" enctype="multipart/form-data">
      <div class="form-group"><label>Email</label><input type="text" th:value="${student.user.email}" disabled></div>
      <div class="form-group"><label>Full name</label><input type="text" name="name" th:value="${student.user.name}" required></div>
      <div class="form-group"><label>Register number</label><input type="text" name="registerNumber" th:value="${student.registerNumber}" required></div>
      <div class="form-group"><label>Department</label><input type="text" name="department" th:value="${student.department}"></div>
      <div class="form-group"><label>Phone</label><input type="tel" name="phone" th:value="${student.phone}"></div>
      <div class="form-group"><label>Educational qualifications</label>
        <textarea name="education" maxlength="1000" placeholder="e.g. B.E. CSE, ABC College, 2026, CGPA 8.2; HSC 92%" th:text="${student.education}"></textarea></div>
      <div class="form-group"><label>Skills (comma separated)</label>
        <textarea name="skills" maxlength="1000" placeholder="Java, Spring Boot, MySQL, HTML, Git" th:text="${student.skills}"></textarea></div>
      <div class="form-group"><label>Certifications</label>
        <textarea name="certifications" maxlength="1000" placeholder="e.g. Oracle Java SE 11 (2025); NPTEL Python" th:text="${student.certifications}"></textarea></div>
      <div class="form-group"><label>GitHub link</label><input type="url" name="githubUrl" th:value="${student.githubUrl}" placeholder="https://github.com/username"></div>
      <div class="form-group"><label>LinkedIn link</label><input type="url" name="linkedinUrl" th:value="${student.linkedinUrl}" placeholder="https://linkedin.com/in/username"></div>
      <div class="form-group">
        <label>Resume (PDF, DOC, DOCX &ndash; max 5 MB)</label>
        <input type="file" name="resume" accept=".pdf,.doc,.docx">
        <div class="small muted" th:if="${student.resumePath != null}">A resume is already uploaded. Choose a file only if you want to replace it.</div>
        <div class="small muted" th:if="${student.resumePath == null}">No resume uploaded yet.</div>
      </div>
      <button type="submit" class="btn">Save profile</button>
    </form>
  </div>
  <div th:replace="~{fragments/layout :: settings}"></div>
</main>
</body>
</html>
